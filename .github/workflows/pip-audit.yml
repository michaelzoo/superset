name: Python Dependency Vulnerability Audit

on:
  push:
    branches:
      - "master"
      - "[0-9].[0-9]*"
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check for file changes
        id: check
        uses: ./.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.check.outputs.python
        uses: ./.github/actions/setup-backend/
        with:
          requirements-type: base

      - name: Run pip-audit
        if: steps.check.outputs.python
        run: |
          uv pip install --system pip-audit
          pip-audit -r requirements/base.txt --strict --desc \
            --ignore-vuln CVE-2026-27205 \
            --ignore-vuln CVE-2026-44307 \
            --ignore-vuln CVE-2026-44405 \
            --ignore-vuln CVE-2026-44431 \
            --ignore-vuln CVE-2026-44432
